<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .sidebar {
            width: 250px;
            background: #2d6a4f;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .sidebar h2 {
            margin-bottom: 20px;
        }
        .menu-item {
            padding: 15px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-item:hover {
            background: #1b4332;
            border-radius: 5px;
        }
        .dashboard-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .section {
            display: none;
        }
        .active {
            display: block;
        }
        .product-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            width: 200px;
            text-align: center;
            transition: 0.3s;
        }
        .product-item img {
            width: 100px;
            height: 100px;
            border-radius: 5px;
        }
        .delete-button {
            background: red;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Seller Dashboard</h2>
        <div class="menu-item" onclick="showSection('profile-section')">Profile</div>
        <div class="menu-item" onclick="showSection('product-section')">Product Listing</div>
    </div>
    <div class="dashboard-content">
        <div id="profile-section" class="section active">
            <h3>Profile Details</h3>
            <input type="text" placeholder="Full Name">
            <input type="text" placeholder="Occupation">
            <input type="email" placeholder="Email Address">
            <input type="text" placeholder="Phone Number">
            <input type="text" placeholder="Address">
            <button>Update Profile</button>
        </div>
        <div id="product-section" class="section">
            <h1>Manage Your Products</h1>
            <div class="add-product">
                <h3>Add New Product</h3>
                <input type="text" id="product-name" placeholder="Product Name">
                <input type="file" id="product-image" accept="image/*">
                <button onclick="addProduct()">Add Product</button>
            </div>
            <h3>Existing Products</h3>
            <div class="product-list" id="product-container"></div>
        </div>
    </div>
    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
        }
        
        function addProduct() {
            const name = document.getElementById('product-name').value;
            const fileInput = document.getElementById('product-image');
            const file = fileInput.files[0];
            
            if (name && file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const productDiv = document.createElement('div');
                    productDiv.classList.add('product-item');
                    productDiv.innerHTML = `
                        <button class="delete-button" onclick="this.parentElement.remove()">Delete</button>
                        <img src="${e.target.result}" alt="Product">
                        <p><strong>${name}</strong></p>
                    `;
                    document.getElementById('product-container').appendChild(productDiv);
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
